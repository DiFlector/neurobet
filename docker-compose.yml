services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autobet_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/autobet.db}
      - DEEPSEEK_TOKEN=${DEEPSEEK_TOKEN}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/autobet
      dockerfile: Dockerfile
    container_name: autobet_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped
