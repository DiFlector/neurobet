services:
  # ============================================================================
  # Infrastructure: PostgreSQL with TimescaleDB Extension (Dedicated Container)
  # ============================================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: neurobet_postgres
    restart: unless-stopped
    shm_size: 512m
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1536MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurobet}
      POSTGRES_USER: ${POSTGRES_USER:-neurobet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurobet_secure_pass}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-timescale.sh:/docker-entrypoint-initdb.d/init-timescale.sh:ro
    networks:
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2560M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurobet} -d ${POSTGRES_DB:-neurobet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Infrastructure: Redis & Redis Streams
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: neurobet_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6385}:6379"
    volumes:
      - redis_data:/data
    networks:
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Infrastructure: S3 Object Storage (Raw Snapshots & Documents)
  # ============================================================================
  minio:
    image: zenko/cloudserver:latest
    container_name: neurobet_minio
    restart: unless-stopped
    environment:
      ENDPOINT: minio,localhost,127.0.0.1
      SCALITY_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-neurobet_minio}
      SCALITY_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-neurobet_minio_secret_pass}
      S3BACKEND: file
      S3DATAPATH: /data
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9005}:8000"
    volumes:
      - minio_data:/data
    networks:
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Core Platform: Backend API (FastAPI)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: neurobet_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      FLASHSCORE_WORKER_BROWSER_PROCESSES: ${FLASHSCORE_WORKER_BROWSER_PROCESSES:-2}
      FLASHSCORE_WORKER_TENNIS_POINT_CONCURRENCY: ${FLASHSCORE_WORKER_TENNIS_POINT_CONCURRENCY:-1}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neurobet-public
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Fonbet Collector
  # ============================================================================
  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    container_name: neurobet_collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - neurobet-public
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Bet Manager (Validation & Virtual Bankroll)
  # ============================================================================
  bet-manager:
    build:
      context: .
      dockerfile: services/bet-manager/Dockerfile
    container_name: neurobet_bet_manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Neural ML Inference
  # ============================================================================
  neural:
    build:
      context: .
      dockerfile: services/neural/Dockerfile
    container_name: neurobet_neural
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./models/checkpoints:/app/models/checkpoints
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8192M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Local LLM Context Service
  # ============================================================================
  llm:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    container_name: neurobet_llm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./models:/models
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - neurobet-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Infrastructure: SearXNG (private search for research service)
  # ============================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: neurobet_searxng
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-neurobet_searxng_change_me}
    volumes:
      - ./infra/searxng:/etc/searxng:rw
    networks:
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================================
  # Core Platform: Web Research
  # ============================================================================
  research-proxy-relay:
    build:
      context: .
      dockerfile: services/research/proxy-relay.Dockerfile
    container_name: neurobet_research_proxy_relay
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    command:
      - TCP-LISTEN:${RESEARCH_PROXY_PORT:-17890},bind=${NEUROBET_PUBLIC_GATEWAY:-172.26.0.1},reuseaddr,fork
      - TCP:127.0.0.1:${HOST_HTTP_PROXY_PORT:-7890}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "nc -z ${NEUROBET_PUBLIC_GATEWAY:-172.26.0.1} ${RESEARCH_PROXY_PORT:-17890}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

  research:
    build:
      context: .
      dockerfile: services/research/Dockerfile
    container_name: neurobet_research
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      RESEARCH_SEARCH_BACKEND: ${RESEARCH_SEARCH_BACKEND:-hybrid}
      RESEARCH_SEARXNG_URL: ${RESEARCH_SEARXNG_URL:-http://searxng:8080}
      RESEARCH_PERSIST_DB: ${RESEARCH_PERSIST_DB:-true}
      RESEARCH_TIMEOUT_SECONDS: ${RESEARCH_TIMEOUT_SECONDS:-15}
      FLASHSCORE_TENNIS_POINT_POLL_SECONDS: ${FLASHSCORE_TENNIS_POINT_POLL_SECONDS:-30}
      FLASHSCORE_TENNIS_POINT_CONCURRENCY: ${FLASHSCORE_TENNIS_POINT_CONCURRENCY:-2}
      FLASHSCORE_TENNIS_PROFILE_CONCURRENCY: ${FLASHSCORE_TENNIS_PROFILE_CONCURRENCY:-2}
      FLASHSCORE_BROWSER_PROCESSES: ${FLASHSCORE_BROWSER_PROCESSES:-2}
      FLASHSCORE_BROWSER_SLOT_DIR: /run/flashscore-browser-slots
      FLASHSCORE_BROWSER_SLOT_WAIT_SECONDS: ${FLASHSCORE_BROWSER_SLOT_WAIT_SECONDS:-300}
      FLASHSCORE_BROWSER_MAX_JOBS: ${FLASHSCORE_BROWSER_MAX_JOBS:-50}
      FLASHSCORE_BROWSER_MAX_AGE_SECONDS: ${FLASHSCORE_BROWSER_MAX_AGE_SECONDS:-900}
      FLASHSCORE_EXECUTOR_ENABLED: "true"
      RESEARCH_HTTP_PROXY: ${RESEARCH_HTTP_PROXY:-http://${NEUROBET_PUBLIC_GATEWAY:-172.26.0.1}:${RESEARCH_PROXY_PORT:-17890}}
      HTTP_PROXY: ${RESEARCH_HTTP_PROXY:-http://${NEUROBET_PUBLIC_GATEWAY:-172.26.0.1}:${RESEARCH_PROXY_PORT:-17890}}
      HTTPS_PROXY: ${RESEARCH_HTTP_PROXY:-http://${NEUROBET_PUBLIC_GATEWAY:-172.26.0.1}:${RESEARCH_PROXY_PORT:-17890}}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},minio,postgres,redis,searxng,backend,worker,neural,bet-manager
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},minio,postgres,redis,searxng,backend,worker,neural,bet-manager
      POSTGRES_HOST: postgres
      POSTGRES_INTERNAL_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      research-proxy-relay:
        condition: service_healthy
    networks:
      - neurobet-public
      - neurobet-internal
    volumes:
      - flashscore_browser_slots:/run/flashscore-browser-slots
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  flashscore-worker:
    build:
      context: .
      dockerfile: services/research/Dockerfile
    container_name: neurobet_flashscore_worker
    restart: unless-stopped
    command: ["python", "-m", "app.flashscore_worker"]
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      FLASHSCORE_EXECUTOR_ENABLED: "true"
      FLASHSCORE_DISCOVERY_SECONDS: ${FLASHSCORE_DISCOVERY_SECONDS:-5}
      FLASHSCORE_PREPARATION_SECONDS: ${FLASHSCORE_PREPARATION_SECONDS:-60}
      FLASHSCORE_ARCHIVE_DISCOVERY_SECONDS: ${FLASHSCORE_ARCHIVE_DISCOVERY_SECONDS:-900}
      FLASHSCORE_TENNIS_POINT_POLL_SECONDS: ${FLASHSCORE_TENNIS_POINT_POLL_SECONDS:-30}
      FLASHSCORE_TENNIS_POINT_CONCURRENCY: ${FLASHSCORE_WORKER_TENNIS_POINT_CONCURRENCY:-1}
      FLASHSCORE_TENNIS_PROFILE_CONCURRENCY: ${FLASHSCORE_WORKER_PROFILE_CONCURRENCY:-2}
      FLASHSCORE_BROWSER_PROCESSES: ${FLASHSCORE_WORKER_BROWSER_PROCESSES:-2}
      FLASHSCORE_BROWSER_SLOT_DIR: /run/flashscore-browser-slots
      FLASHSCORE_BROWSER_SLOT_WAIT_SECONDS: ${FLASHSCORE_BROWSER_SLOT_WAIT_SECONDS:-300}
      FLASHSCORE_BROWSER_MAX_JOBS: ${FLASHSCORE_BROWSER_MAX_JOBS:-50}
      FLASHSCORE_BROWSER_MAX_AGE_SECONDS: ${FLASHSCORE_BROWSER_MAX_AGE_SECONDS:-900}
      RESEARCH_HTTP_PROXY: ${RESEARCH_HTTP_PROXY:-http://${NEUROBET_PUBLIC_GATEWAY:-172.26.0.1}:${RESEARCH_PROXY_PORT:-17890}}
      HTTP_PROXY: ${RESEARCH_HTTP_PROXY:-http://${NEUROBET_PUBLIC_GATEWAY:-172.26.0.1}:${RESEARCH_PROXY_PORT:-17890}}
      HTTPS_PROXY: ${RESEARCH_HTTP_PROXY:-http://${NEUROBET_PUBLIC_GATEWAY:-172.26.0.1}:${RESEARCH_PROXY_PORT:-17890}}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},minio,postgres,redis,searxng,backend,research,worker,neural,bet-manager
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},minio,postgres,redis,searxng,backend,research,worker,neural,bet-manager
      POSTGRES_HOST: postgres
      POSTGRES_INTERNAL_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      research-proxy-relay:
        condition: service_healthy
    networks:
      - neurobet-public
      - neurobet-internal
    volumes:
      - flashscore_browser_slots:/run/flashscore-browser-slots
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if os.path.exists('/tmp/healthy') and time.time()-os.path.getmtime('/tmp/healthy') < 45 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Streams Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: neurobet_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neurobet-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Presentation: Frontend Dashboard (Next.js / Node.js)
  # Target URL via nginx-master: necrolich.ru/diflector/neurobet
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    container_name: neurobet_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:8000
      TZ: ${TZ:-UTC}
    ports:
      - "${FRONTEND_PORT:-8085}:3000"
    networks:
      - neurobet-public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/diflector/neurobet/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Observability & Monitoring: Prometheus & Grafana (Phase 20)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: neurobet_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9095}:9090"
    networks:
      - neurobet-internal
      - neurobet-public
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: neurobet_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-neurobet2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-8086}:3000"
    networks:
      - neurobet-internal
      - neurobet-public
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      - prometheus

# ==============================================================================
# Networks Isolation Policy
# ==============================================================================
networks:
  # Public bridge network for incoming web traffic and outbound web requests
  neurobet-public:
    name: neurobet_public_net
    driver: bridge

  # Strictly internal isolated network for databases, queues, and financial ledger
  neurobet-internal:
    name: neurobet_internal_net
    driver: bridge
    internal: false # Keep false in development to permit external monitoring if needed, or true in production

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  flashscore_browser_slots:
    name: neurobet_flashscore_browser_slots
  pg_data:
    name: neurobet_pg_data
  redis_data:
    name: neurobet_redis_data
  minio_data:
    name: neurobet_minio_data
  prometheus_data:
    name: neurobet_prometheus_data
  grafana_data:
    name: neurobet_grafana_data
