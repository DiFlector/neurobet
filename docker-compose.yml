services:
  # ============================================================================
  # Infrastructure: PostgreSQL with TimescaleDB Extension (Dedicated Container)
  # ============================================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: neurobet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurobet}
      POSTGRES_USER: ${POSTGRES_USER:-neurobet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurobet_secure_pass}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-timescale.sh:/docker-entrypoint-initdb.d/init-timescale.sh:ro
    networks:
      - neurobet-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurobet} -d ${POSTGRES_DB:-neurobet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Infrastructure: Redis & Redis Streams
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: neurobet_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${REDIS_PORT:-6385}:6379"
    volumes:
      - redis_data:/data
    networks:
      - neurobet-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Infrastructure: S3 Object Storage (Raw Snapshots & Documents)
  # ============================================================================
  minio:
    image: zenko/cloudserver:latest
    container_name: neurobet_minio
    restart: unless-stopped
    environment:
      ENDPOINT: minio,localhost,127.0.0.1
      SCALITY_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-neurobet_minio}
      SCALITY_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-neurobet_minio_secret_pass}
      S3BACKEND: file
      S3DATAPATH: /data
      TZ: ${TZ:-UTC}
    ports:
      - "${MINIO_API_PORT:-9005}:8000"
    volumes:
      - minio_data:/data
    networks:
      - neurobet-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Core Platform: Backend API (FastAPI)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: neurobet_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${BACKEND_PORT:-8005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neurobet-public
      - neurobet-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Fonbet Collector
  # ============================================================================
  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    container_name: neurobet_collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - neurobet-public
      - neurobet-internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Bet Manager (Validation & Virtual Bankroll)
  # ============================================================================
  bet-manager:
    build:
      context: .
      dockerfile: services/bet-manager/Dockerfile
    container_name: neurobet_bet_manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neurobet-internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Neural ML Inference
  # ============================================================================
  neural:
    build:
      context: .
      dockerfile: services/neural/Dockerfile
    container_name: neurobet_neural
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - neurobet-internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Local LLM Context Service
  # ============================================================================
  llm:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    container_name: neurobet_llm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - neurobet-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Web Research
  # ============================================================================
  research:
    build:
      context: .
      dockerfile: services/research/Dockerfile
    container_name: neurobet_research
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - neurobet-public
      - neurobet-internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Core Platform: Streams Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: neurobet_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - neurobet-internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Presentation: Frontend Dashboard (Next.js / Node.js)
  # Target URL via nginx-master: necrolich.ru/diflector/neurobet
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    container_name: neurobet_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      TZ: ${TZ:-UTC}
    ports:
      - "${FRONTEND_PORT:-8085}:3000"
    networks:
      - neurobet-public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==============================================================================
# Networks Isolation Policy
# ==============================================================================
networks:
  # Public bridge network for incoming web traffic and outbound web requests
  neurobet-public:
    name: neurobet_public_net
    driver: bridge

  # Strictly internal isolated network for databases, queues, and financial ledger
  neurobet-internal:
    name: neurobet_internal_net
    driver: bridge
    internal: false # Keep false in development to permit external monitoring if needed, or true in production

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  pg_data:
    name: neurobet_pg_data
  redis_data:
    name: neurobet_redis_data
  minio_data:
    name: neurobet_minio_data
