[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-sport-hockey"
version = "1.0.0"
description = "Hockey sport adapter for Neurobet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hockey_adapter"]
