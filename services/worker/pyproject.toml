[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-worker"
version = "0.1.0"
description = "Asynchronous task and Redis Streams consumer worker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "redis>=5.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
