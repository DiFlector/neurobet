[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-collector"
version = "1.0.0"
description = "Fonbet live sports data collector with Playwright, MinIO raw storage, and Redis Streams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "playwright>=1.43.0",
    "pydantic>=2.7.0",
    "redis>=5.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
