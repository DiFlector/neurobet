[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-collector"
version = "0.1.0"
description = "Fonbet sports data collector for Neurobet"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "redis>=5.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
