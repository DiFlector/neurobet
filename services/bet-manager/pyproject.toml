[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-bet-manager"
version = "0.1.0"
description = "Central validation, risk engine and paper bankroll controller"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "redis>=5.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
