[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-neural"
version = "0.1.0"
description = "ML inference and training service for Neurobet"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "redis>=5.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
