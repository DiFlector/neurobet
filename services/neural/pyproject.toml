[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-neural"
version = "0.1.0"
description = "ML inference and baseline training service for Neurobet"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "redis>=5.0.4",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "neurobet-contracts>=0.1.0",
    "neurobet-db>=0.1.0",
    "neurobet-features>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
