# Neurobet private SearXNG — JSON API for research service only.
# Docs: https://docs.searxng.org/admin/settings/settings.html
use_default_settings: true

general:
  instance_name: "neurobet-searxng"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  # Переопределяется env SEARXNG_SECRET в docker-compose при старте.
  secret_key: "08287bed828f1690991e84f2e3c28bd05d8ecb44f0fe59be1fb2202de29a8f80"
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true

# Без публичного UI-лимитера: инстанс только во внутренней сети.
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
