global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "neurobet-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"

  - job_name: "neurobet-bet-manager"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["bet-manager:8000"]
        labels:
          service: "bet-manager"

  - job_name: "neurobet-llm"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["llm:8000"]
        labels:
          service: "llm"

  - job_name: "neurobet-research"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["research:8000"]
        labels:
          service: "research"
