[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-contracts"
version = "1.0.0"
description = "Canonical contracts and schemas for Neurobet platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
