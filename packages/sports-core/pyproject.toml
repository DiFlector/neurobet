[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-sports-core"
version = "0.1.0"
description = "Core abstractions and sport registry for Neurobet"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sports_core"]
