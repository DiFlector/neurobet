[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobet-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Neurobet platform control, metrics, and models"
readme = "README.md"
authors = [{ name = "Neurobet Engineering Team" }]
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
neurobet-mcp = "neurobet_mcp.server:main"
