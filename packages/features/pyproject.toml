[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-features"
version = "0.1.0"
description = "Feature engineering framework with rolling windows and zero-data-leakage point-in-time calculation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "neurobet-contracts>=0.1.0",
    "neurobet-db>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/features"]
