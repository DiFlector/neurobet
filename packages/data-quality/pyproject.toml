[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-data-quality"
version = "0.1.0"
description = "Historical data quality audit engine and health reporting for Neurobet"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "neurobet-db>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data_quality"]
