[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobet-db"
version = "0.1.0"
description = "Database models, connection pools, and migration schema for Neurobet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/db"]
