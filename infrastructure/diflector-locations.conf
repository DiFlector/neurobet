# diflector на necrolich.ru — корни проектов = URL-путь
# /diflector/neurobet     → neurobet (v1, Next.js basePath)
# /diflector/dev/neurobet → neurobet dev (training / model export)
# /diflector/neurobet-2   → neurobet-2 (nb-frontend в nginx-master-network)

# --- neurobet (autobet) prod ---
location /diflector/neurobet {
    set $neurobet_frontend http://neurobet_frontend:3000;
    proxy_pass $neurobet_frontend;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout  600s;
    client_max_body_size 1024m;
}

# --- neurobet dev ---
location /diflector/dev/neurobet {
    auth_basic off;
    set $neurobet_dev_frontend http://neurobet_dev_frontend:3000;
    proxy_pass $neurobet_dev_frontend;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout  600s;
    client_max_body_size 1024m;
}

# --- neurobet-2 ---
location /diflector/neurobet-2 {
    set $nb2_frontend http://nb-frontend:80;
    proxy_pass $nb2_frontend;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout  300s;
    client_max_body_size 32m;
}

# Редиректы со старых URL
location = /neurobet {
    return 301 /diflector/neurobet;
}
location /neurobet/ {
    rewrite ^/neurobet/(.*)$ /diflector/neurobet/$1 permanent;
}
